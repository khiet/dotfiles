onboarding = false
# herdr configuration
# Symlinked to $XDG_CONFIG_HOME/herdr/config.toml
#
# Run `herdr --default-config` to see every option with its default.
# Run `herdr config check` after editing to validate this file.

[theme]
# Matches Ghostty (theme = Dracula) and the tmux dracula plugin.
name = "dracula"

[terminal]
# New panes inherit the cwd of the pane they were opened from, like tmux.
new_cwd = "follow"

[keys]
# tmux uses C-a as prefix, so herdr does too. This only works because herdr
# runs standalone in a Ghostty tab rather than nested inside tmux; if that
# ever changes, move this back to "ctrl+b" so tmux keeps ctrl+a.
prefix = "ctrl+a"

# Pane focus with hjkl, same as the tmux binds. These match herdr's defaults
# and are spelled out only so the mapping is obvious next to the tmux config.
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# Swapped from herdr's defaults: tmux binds `prefix r` to reload, and resizes
# with shifted keys (H/J/K/L). Keeping reload on the unshifted key preserves
# the more frequently used muscle memory.
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"

# tmux binds `prefix Space` to last-window. herdr has no last-tab action, so
# this maps to the nearest equivalent toggle.
last_pane = "prefix+space"

# tmux split bindings. herdr calls these "split right" and "split down", which
# line up with tmux's `%` (side by side) and `"` (stacked). Both keys need
# shift, and herdr warns that shifted punctuation depends on the terminal; if
# either stops registering, fall back to the defaults "prefix+v" and
# "prefix+minus".
split_vertical = "prefix+%"
split_horizontal = 'prefix+"'

# Copy mode: vim motions, / and ? search over the whole scrollback, v to select,
# y to copy. herdr ships this unbound. `prefix [` is tmux's copy mode key, which
# is why tab cycling stays on herdr's prefix+p/prefix+n defaults.
copy_mode = "prefix+["

# lazygit in a popup, using the lazygit config already in this repo.
# Ghostty sets macos-option-as-alt = left, so alt chords reach herdr.
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
width = "80%"
height = "80%"

[ui]
# Dracula green, the same colour as the tmux active pane border.
accent = "#50fa7b"

# Keep the sidebar out of the way by default; `prefix b` (herdr's default
# toggle_sidebar bind) brings it back. Collapsed mode stays on "compact" so
# the narrow status rail still shows each agent's state; set
# sidebar_collapsed_mode = "hidden" for zero width. Takes effect on next
# launch, not on config reload.
sidebar_start_collapsed = true

# tmux creates windows immediately on `prefix c`; don't prompt for a tab name.
prompt_new_tab_name = false

# On trial. Gives herdr the wheel (scrollback), click-to-focus, drag-to-split,
# and drag-select, at the cost of Ghostty's own Cmd-click URLs and native
# selection inside panes. Set false to hand the mouse back to Ghostty, which is
# what tmux does here since `mouse on` is never set. Pane apps such as lazygit
# receive mouse events either way when they ask for them.
mouse_capture = true

[ui.toast]
# The point of herdr is walking away from running agents, so surface state
# changes as desktop notifications. "terminal" sends an escape sequence and
# lets Ghostty raise the notification, so no separate herdr entry in macOS
# notification settings. Use "system" to ask macOS directly, "herdr" for
# in-app toasts, or "off" to disable.
delivery = "terminal"

[ui.sound]
enabled = true

[session]
# Reattach agent panes to their native conversation sessions after a server
# restart, so a reboot does not lose in-flight agent context.
resume_agents_on_restore = true

# ===============================================
#    cheat sheets
# ===============================================
# herdr --default-config    show all options and defaults
# herdr config check        validate this file
# herdr status              client and server status
#
# prefix is ctrl+a (same as tmux)
#
# prefix ? for help, prefix q to detach, `herdr` to reattach
# prefix r to reload this config
# prefix w to open the workspace picker (replaces tmux-sessionx prefix o)
# prefix g to go to a workspace/tab/pane by name
# prefix shift+n new workspace, prefix shift+g new git worktree
#
# tabs (tmux windows)
# prefix c new tab, prefix 1..9 switch, prefix p/n prev and next
# prefix shift+t rename, prefix shift+x close
#
# panes
# prefix % split side by side, prefix " split stacked
# prefix h/j/k/l focus, prefix space last pane
# prefix z zoom, prefix x close, prefix shift+r resize mode
# prefix [ copy mode, prefix e edit scrollback in $EDITOR
#
# extras
# prefix b toggle sidebar
# prefix alt+g lazygit popup
# ===============================================
