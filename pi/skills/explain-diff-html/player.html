<!-- narration -->
<div class="narration">
  <audio controls preload="metadata" aria-label="Listen to this page" src="data:audio/webm;base64,__AUDIO_BASE64__"></audio>
  <span class="narration-speed" aria-live="polite"></span>
</div>
<style>
  .narration { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; margin: 1rem 0 1.5rem; }
  .narration audio { flex: 1 1 16rem; min-width: 0; max-width: 100%; color-scheme: dark; }
  .narration-speed { min-width: 4ch; color: var(--muted); font: 14px ui-monospace, "Cascadia Code", Menlo, Consolas, monospace; }
  @media print { .narration { display: none; } }
</style>
<script>
  // Mirrors the terminal tts player. Keys act only after the audio has
  // started, so Space and the arrows still scroll for readers who never play it.
  (() => {
    const audio = document.querySelector(".narration audio");
    const speed = document.querySelector(".narration-speed");
    const show = () => { speed.textContent = audio.playbackRate.toFixed(1) + "x"; };
    const setRate = (r) => { audio.playbackRate = Math.min(3, Math.max(0.5, Math.round(r * 10) / 10)); };
    audio.defaultPlaybackRate = 1.5;
    audio.playbackRate = 1.5;
    let started = false;
    audio.addEventListener("play", () => { started = true; }, { once: true });
    audio.addEventListener("ratechange", show);
    show();
    const native = "a, summary, button, input, select, textarea, audio, [contenteditable]";
    document.addEventListener("keydown", (e) => {
      if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
      if (e.target instanceof Element && e.target.closest(native)) return;
      if (!started) return;
      switch (e.key) {
        case " ": audio.paused ? audio.play() : audio.pause(); break;
        case "ArrowLeft": audio.currentTime = Math.max(0, audio.currentTime - 5); break;
        case "ArrowRight": audio.currentTime = Math.min(audio.duration || Infinity, audio.currentTime + 5); break;
        case "ArrowUp": setRate(audio.playbackRate + 0.1); break;
        case "ArrowDown": setRate(audio.playbackRate - 0.1); break;
        default: return;
      }
      e.preventDefault();
    });
  })();
</script>
<!-- /narration -->
